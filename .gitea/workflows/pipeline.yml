name: CI Security Pipeline

on:
  push:
    branches:
      - master

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install bandit safety flake8 cryptography

      - name: Lint (flake8)
        run: |
          flake8 . --max-line-length=120 --exclude=__pycache__ --exit-zero

      - name: SAST - Bandit
        run: |
          bandit -r server/ client/ attacker/ --exit-zero -f json -o bandit-report.json
          bandit -r server/ client/ attacker/ --exit-zero

      - name: SCA - Safety
        run: |
          safety check --exit-zero

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: bandit-report.json
